name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: The malicious fixture must be stopped
        run: |
          set +e
          python scripts/scan.py examples/evil-skill --no-color
          code=$?
          set -e
          test "$code" -eq 2
      - name: The ordinary fixture must pass
        run: python scripts/scan.py examples/plain-skill --no-color
