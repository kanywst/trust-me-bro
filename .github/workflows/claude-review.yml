name: Claude review

# CI answers "does it build and do the tests pass". This asks the question no
# script here can. It reviews, it does not gate: nothing here is a required
# check.
#
# The action refuses to run when this file differs from the copy on the default
# branch, so a pull request cannot rewrite its own reviewer. The cost is that
# any change to this file, including the one that added it, goes unreviewed by
# Claude until it is merged.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# One review per pull request. A rapid re-push cancels the run it superseded
# rather than paying for a review of a diff that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A pull request from a fork gets no secrets, so the job would fail on
    # authentication rather than say anything useful. Drafts are skipped until
    # they are marked ready, which is what the ready_for_review trigger is for.
    #
    # Dependabot is skipped for the same reason as a fork: a run it triggers
    # reads Dependabot secrets, not Actions secrets, so the token is empty no
    # matter what is configured here.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # Required by the action's default GitHub App authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Without the secret the action exits successfully having reviewed
      # nothing, which is worse than failing: the check goes green and the
      # pull request looks reviewed. Fail here instead, where the reason is
      # legible.
      - name: Require the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token', then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      - uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1
        with:
          # A subscription token, not an API key: runs against the Claude plan
          # instead of API credits. Generate it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            trust-me-bro reads an agent skill, plugin, or MCP server before a user
            installs it, and reports what it can reach. `scripts/scan.py` is the whole
            engine: stdlib only, no network, no execution of the target. `rules/rules.json`
            is data, split into `legs` that feed the lethal-trifecta verdict and standalone
            `rules` with their own severity. `SKILL.md` is what an agent actually loads.

            Do not repeat what CI already does. ruff, markdownlint, the unit tests, the
            fixture behaviour checks and CodeQL run on this PR already.

            Look for what only a reader can catch:

            1. False assurance. This tool's worst possible failure is telling someone
               something is fine when it is not. A rule that stops matching, a severity
               quietly demoted, a provenance state that reports "signed" for anything
               short of an actual signature or attestation: each of these is worse than
               the tool not existing. Certificates and public keys are not signatures.

            2. Coverage holes in the lock. `--pin` and `--check` claim to cover the exact
               bytes the user approved. Anything that stops a file from reaching `digests`
               (a suffix filter, a size limit, a skipped directory, an error swallowed)
               reopens the swap-the-payload path. Files that cannot be read still have to
               be hashed and reported.

            3. Suppression reachable by the target. `.trustmebro.ignore` is read from the
               target directory only, never a parent, because anything that can write next
               to a skill would otherwise be able to blind the scanner for it. Any change
               that widens where suppressions come from needs a very good reason.

            4. Prose versus code. The scanner separates a skill that *describes* `~/.ssh`
               from one that *reads* it, so security tooling is not reported for
               documenting an attack. Injection wording is the deliberate exception,
               because a skill is instructions. Check that new rules pick the right side.

            5. Regex quality. Patterns run against every line of every file. Look for
               catastrophic backtracking, an unanchored `.*` that makes a rule match
               everything, and patterns loose enough to fire on ordinary prose. Every
               rule needs a test; a rule with no test is a rule that the next one breaks.

            6. Honesty of the output. Verdict text, `why` strings and README claims are
               part of the product. A claim the code does not support is a bug here.

            Post findings as inline comments on the lines they concern. Use one
            top-level comment for the summary. Be specific and cite
            `file:line`. If the diff is clean against all of the above, say so
            in one line rather than manufacturing nits.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
